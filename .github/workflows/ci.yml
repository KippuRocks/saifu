name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # T-030-11: no user-visible string uses fee vocabulary (REQ-SP-1a) or
      # claims trustless, tamper-proof or decentralised properties (REQ-TM-2).
      - run: pnpm lint:copy
      - name: A forbidden term added to a string fails the copy lint
        run: |
          for term in gas trustless; do
            cp src/App.tsx "$RUNNER_TEMP/App.tsx"
            printf '\nexport const probe = "No %s";\n' "$term" >> src/App.tsx
            if pnpm --silent lint:copy; then
              echo "the copy lint accepted \"$term\"" >&2
              exit 1
            fi
            cp "$RUNNER_TEMP/App.tsx" src/App.tsx
          done
      # T-030-15 — F-070 plan §5.4: every screen renders its screenId, every move
      # between screens is declared, and screens.json is what the sources generate.
      - run: pnpm screens:check
      - name: A screen without an id, or an undeclared screen, fails the screen check
        run: |
          printf 'import { Text } from "react-native";\nexport const Probe = () => <Text>probe</Text>;\n' > src/screens/Probe.tsx
          if pnpm --silent screens:check; then
            echo "the screen check accepted a screen with no id" >&2
            exit 1
          fi
          rm src/screens/Probe.tsx
          cp screens.json "$RUNNER_TEMP/screens.json"
          node -e 'const f="screens.json",m=JSON.parse(require("fs").readFileSync(f));m.screens.pop();require("fs").writeFileSync(f,JSON.stringify(m,null,2)+"\n")'
          if pnpm --silent screens:check; then
            echo "the screen check accepted an out-of-date screens.json" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/screens.json" screens.json
      # Every native dependency matches the Expo SDK in use.
      - run: pnpm deps:check
      # Metro bundles and compiles to Hermes bytecode for both platforms.
      - run: pnpm bundle:check

  vendor:
    name: Vendored libticketto reproduces from its pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm vendor:check

  # T-030-18: Saifu Web — the same app from Expo's web target, exported, then driven
  # in Chromium with a virtual authenticator: it onboards, registers and shows the
  # checkout pairing code, and after one visit produces a pass with the network off
  # (T-030-19). The page runs at its own origin, saifu.kippu.rocks, and
  # every service it calls is a local stand-in answered through request
  # interception (test/web/stack.ts): nothing is deployed and no DNS is involved.
  web:
    name: Saifu Web — build and smoke test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm web:smoke
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saifu-web-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # T-030-01: a development build (expo-dev-client, Debug) is generated with
  # `expo prebuild`, built locally on the runner, installed on an emulator, and
  # driven by Maestro. No Expo or EAS account is involved.
  android:
    name: Android development build — install and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build the development build
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
      - run: tools/ci/install-maestro.sh
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Install on an emulator and run Maestro
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r android/app/build/outputs/apk/debug/app-debug.apk && tools/ci/smoke.sh android
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: build/maestro-results
          if-no-files-found: ignore

  ios:
    name: iOS development build — install and smoke test
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        run: pnpm exec expo prebuild --platform ios --clean
      - name: Build the development build for the simulator
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -workspace ios/Saifu.xcworkspace \
            -scheme Saifu \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ONLY_ACTIVE_ARCH=YES \
            build | tail -n 200
      - run: tools/ci/install-maestro.sh
      - name: Install on a simulator and run Maestro
        run: |
          udid=$(tools/ci/boot-simulator.sh)
          xcrun simctl install "$udid" build/ios/Build/Products/Debug-iphonesimulator/Saifu.app
          tools/ci/smoke.sh ios
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: build/maestro-results
          if-no-files-found: ignore
