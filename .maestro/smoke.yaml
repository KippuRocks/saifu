# T-030-01 — the development build installs, loads its JavaScript from Metro, and
# renders the application shell. Run by tools/ci/smoke.sh on both platforms,
# which opens the development build on the Metro server before this flow starts.
appId: ${APP_ID}
name: Development build smoke test
---
# iOS asks before handing a custom-scheme link to the app, and the prompt can
# appear some seconds after the link is opened: keep answering it until the
# shell renders. A first load that fails transiently (the development client's
# error screen, or React Native's) is retried with its Reload button.
- repeat:
    while:
      notVisible:
        id: "saifu-root"
    times: 60
    commands:
      # An emulator's own apps sometimes stop responding while it settles, and
      # their "isn't responding" dialog covers Saifu; let them wait.
      - tapOn:
          text: "Wait"
          optional: true
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Reload"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "saifu-root"
          timeout: 10000
          optional: true
- assertVisible:
    id: "saifu-root"
- assertVisible: "Saifu"
# T-030-15: the screen carries its screenId, and marks itself settled.
- assertVisible:
    id: "holder.onboarding"
- extendedWaitUntil:
    visible:
      id: "holder.onboarding.settled"
    timeout: 30000
# T-030-04: a first run shows the recovery disclosure before any passkey exists.
- assertVisible:
    id: "recovery-disclosure"
- assertVisible: "Only you can reach your tickets"
# T-030-02: the native passkey bridge is linked into the build and reports the
# platform as passkey-capable.
- assertVisible:
    id: "passkey-bridge-linked"
# T-030-10: an invitation link opened before Saifu is set up waits for setup, and
# says so on the onboarding screen.
- openLink: "saifu://invitations#AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "holder.onboarding.pending-link"
    timeout: 30000
- assertVisible:
    id: "holder.onboarding.settled"
